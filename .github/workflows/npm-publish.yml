name: Publish to npm

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v3.0.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      # Reconstruct the dist/ layout that npm-publish.sh expects from
      # the already-published GitHub release assets.
      - name: Reconstruct dist/ from release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"

          gh release download "${{ inputs.tag }}" \
            --pattern "genlinx_${VERSION}_linux_amd64.tar.gz" \
            --pattern "genlinx_${VERSION}_linux_arm64.tar.gz" \
            --pattern "genlinx_${VERSION}_darwin_amd64.tar.gz" \
            --pattern "genlinx_${VERSION}_darwin_arm64.tar.gz" \
            --pattern "genlinx_${VERSION}_windows_amd64.zip" \
            --pattern "genlinx_${VERSION}_windows_arm64.zip"

          mkdir -p \
            dist/genlinx_linux_amd64_v1 \
            dist/genlinx_linux_arm64_v8.0 \
            dist/genlinx_darwin_amd64_v1 \
            dist/genlinx_darwin_arm64_v8.0 \
            dist/genlinx_windows_amd64_v1 \
            dist/genlinx_windows_arm64_v8.0

          tar xf "genlinx_${VERSION}_linux_amd64.tar.gz"  -C dist/genlinx_linux_amd64_v1   genlinx
          tar xf "genlinx_${VERSION}_linux_arm64.tar.gz"  -C dist/genlinx_linux_arm64_v8.0  genlinx
          tar xf "genlinx_${VERSION}_darwin_amd64.tar.gz" -C dist/genlinx_darwin_amd64_v1   genlinx
          tar xf "genlinx_${VERSION}_darwin_arm64.tar.gz" -C dist/genlinx_darwin_arm64_v8.0  genlinx
          unzip -j "genlinx_${VERSION}_windows_amd64.zip" genlinx.exe -d dist/genlinx_windows_amd64_v1
          unzip -j "genlinx_${VERSION}_windows_arm64.zip" genlinx.exe -d dist/genlinx_windows_arm64_v8.0

          printf '{"version":"%s"}\n' "${VERSION}" > dist/metadata.json

      - name: Publish to npm
        run: RUN_GORELEASER=false MODE=publish bash ./scripts/npm-publish.sh
