name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write
  id-token: write

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  release:
    name: Release
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install typos
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff,typos-cli

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update GitHub Release with Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading release notes to GitHub Release..."
          gh release edit ${{ github.ref_name }} --notes-file RELEASE_NOTES.md

      - name: Commit Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/commit.sh ${{ github.ref_name }}

  npm-publish:
    name: Publish to npm
    needs: release
    uses: ./.github/workflows/npm-publish.yml
    with:
      tag: ${{ github.ref_name }}
