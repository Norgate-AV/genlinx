version: 2

project_name: genlinx

before:
  hooks:
    - go mod tidy
    - ./scripts/generate-changelog.sh {{ .Tag }}
    - ./scripts/generate-release-notes.sh {{ .Tag }}

builds:
  - id: genlinx
    main: .
    env:
      - CGO_ENABLED=0
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -extldflags=-static
      - -X 'github.com/Norgate-AV/genlinx/internal/version.Version={{ .Version }}'
      - -X 'github.com/Norgate-AV/genlinx/internal/version.GitCommit={{ .Commit }}'
      - -X 'github.com/Norgate-AV/genlinx/internal/version.BuildDate={{ .Date }}'
    flags:
      - -trimpath

archives:
  - format_overrides:
      - goos: windows
        formats:
          - zip

source:
  enabled: true
  # Override default ('{{ .ProjectName }}-{{ .Version }}') to use underscores
  # for consistency with binary archive names, and to add a _source suffix so
  # the asset is clearly distinguishable from binary archives in the release.
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"

changelog:
  disable: true

release:
  # Using `git-cliff` to generate release notes.
  # Release notes are given via args in the action.
  mode: replace
  prerelease: auto

dockers:
  - image_templates:
      - "ghcr.io/norgate-av/genlinx:{{ .Version }}-amd64"
      - "ghcr.io/norgate-av/genlinx:latest-amd64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--platform=linux/amd64"
    extra_files:
      - go.mod
      - go.sum
      - cmd
      - internal
    goarch: amd64
  - image_templates:
      - "ghcr.io/norgate-av/genlinx:{{ .Version }}-arm64"
      - "ghcr.io/norgate-av/genlinx:latest-arm64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--platform=linux/arm64"
    extra_files:
      - go.mod
      - go.sum
      - cmd
      - internal
    goarch: arm64

docker_manifests:
  - name_template: "ghcr.io/norgate-av/genlinx:{{ .Version }}"
    image_templates:
      - "ghcr.io/norgate-av/genlinx:{{ .Version }}-amd64"
      - "ghcr.io/norgate-av/genlinx:{{ .Version }}-arm64"
  - name_template: "ghcr.io/norgate-av/genlinx:latest"
    image_templates:
      - "ghcr.io/norgate-av/genlinx:latest-amd64"
      - "ghcr.io/norgate-av/genlinx:latest-arm64"
