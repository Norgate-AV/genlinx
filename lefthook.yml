pre-commit:
  parallel: true
  commands:
    # Go formatting
    go-fmt:
      glob: "*.go"
      stage_fixed: true
      run: go fmt ./...

    # Go module tidying
    go-mod-tidy:
      files: git diff --name-only --cached
      glob: "{go.mod,go.sum}"
      stage_fixed: true
      run: go mod tidy

    # Go vetting
    go-vet:
      glob: "*.go"
      run: go vet ./...

    # Go linting
    golangci-lint:
      glob: "*.go"
      stage_fixed: true
      run: golangci-lint run --fix

    # Run tests
    go-test:
      glob: "*.go"
      run: go test ./...

    # Trailing whitespace and merge conflict marker checks
    # Exclude testdata/ — golden files must match code output exactly.
    trailing-whitespace:
      run: git diff --check --cached -- . ':(exclude)*/testdata/**'

pre-push:
  parallel: true
  commands:
    # Run comprehensive tests before push
    go-test-race:
      run: |
        go test -race ./...

    # Security scan
