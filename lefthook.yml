pre-commit:
  parallel: true
  commands:
    # Go formatting
    go-fmt:
      glob: "*.go"
      run: |
        go fmt ./...
        git add .

    # Go module tidying
    go-mod-tidy:
      files: git diff --name-only --cached
      glob: "{go.mod,go.sum}"
      run: |
        go mod tidy
        git add go.mod go.sum

    # Go vetting
    go-vet:
      glob: "*.go"
      run: |
        go vet ./...

    # Go linting
    golangci-lint:
      glob: "*.go"
      run: |
        go tool golangci-lint run --fix
        git add .

    # Run tests
    go-test:
      glob: "*.go"
      run: |
        go test ./...

    # Trailing whitespace and merge conflict marker checks
    trailing-whitespace:
      run: git diff --check --cached

pre-push:
  parallel: true
  commands:
    # Run comprehensive tests before push
    go-test-race:
      run: |
        go test -race ./...

