commit-msg:
  commands:
    # Conventional commit format validation
    commitizen:
      run: ./scripts/commitizen.sh {1}
    spell-check:
      run: ./scripts/spellcheck.sh {1}

colors: true

output:
  - execution_out
  - execution_info
  - summary
